<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetSecurityCare | Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="contenedor">
    <div class="card login-card">
        <h1>VetSecurityCare</h1>
        <h2>Inicio de sesión</h2>

        <p class="texto-suave">
            Ingresa con un usuario autorizado para acceder al sistema.
        </p>

        <div th:if="${param.error}" class="alerta error">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="alerta exito">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Ej: admin o user" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

            <button type="submit" class="btn btn-full">Ingresar</button>
        </form>

        <div class="credenciales">
            <p><strong>Usuario admin:</strong> admin / admin123</p>
            <p><strong>Usuario normal:</strong> user / user123</p>
        </div>

        <a th:href="@{/}" class="link-volver">Volver a página pública</a>
    </div>
</div>

</body>
</html>
