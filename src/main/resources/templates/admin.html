<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetSecurityCare | Área Administrador</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="contenedor">
    <div class="card">
        <h1>Panel de administración</h1>

        <p>
            Esta sección está restringida solo para usuarios con rol ADMIN.
        </p>

        <p>
            En una clínica veterinaria, esta área podría utilizarse para gestionar personal,
            permisos internos, fichas sensibles o configuraciones del sistema.
        </p>

        <div class="info">
            <p><strong>Usuario conectado:</strong> <span th:text="${usuario}"></span></p>
            <p><strong>Rol asignado:</strong> <span th:text="${roles}"></span></p>
        </div>

        <div class="botones">
            <a th:href="@{/bienvenida}" class="btn">Volver</a>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-salir">Cerrar sesión</button>
        </form>
    </div>
</div>

</body>
</html>
